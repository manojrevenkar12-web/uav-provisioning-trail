# Every failure code a step can raise: what it means, who owns it, and what the station may do about it on its own.
# retry: how many attempts the step gets in total; recover: what happens before the next attempt; from: the step
# the retry restarts at (default: the failing step; {target} is the step's target). owner: who gets the unit when the retries are spent.
link_refused:            {label: "Probe cannot attach", owner: production, retry: 3, recover: reseat, from: "{target}_attach"}
link_dropped:            {label: "Probe link dropped mid-transfer", owner: production, retry: 2, recover: reattach, from: "{target}_attach"}
link_garbled:            {label: "Probe answered nonsense", owner: production, retry: 2, recover: reattach, from: "{target}_attach"}
verify_mismatch:         {label: "Image read-back differs", owner: production, retry: 2, recover: reattach, from: "{target}_attach"}
config_verify_mismatch:  {label: "Config read-back differs", owner: production, retry: 2, recover: reattach, from: "{target}_attach"}
otp_blank:               {label: "No supplier identity on the board", owner: supplier, retry: 1}
otp_crc:                 {label: "Supplier identity fails its CRC", owner: supplier, retry: 1}
board_rev_unsupported:   {label: "Board revision not in the release", owner: engineering, retry: 1}
uid_already_registered:  {label: "Board already belongs to another unit", owner: quality, retry: 1}
image_too_large:         {label: "Image larger than its flash region", owner: engineering, retry: 1}
banner_missing:          {label: "No boot banner", owner: engineering, retry: 2, recover: reattach, from: "{target}_attach"}
selftest_timeout:        {label: "Booted, no self-test verdict", owner: engineering, retry: 2, recover: reattach, from: "{target}_attach"}
selftest_fail:           {label: "Self-test failed", owner: engineering, retry: 1}
version_mismatch:        {label: "Running version is not the released one", owner: engineering, retry: 1}
identity_mismatch:       {label: "Booted board is not the one identified", owner: quality, retry: 1}
usb_no_device:           {label: "Nothing on the recovery port", owner: production, retry: 2, recover: re_enter_recovery}
usb_enumeration_failed:  {label: "Module does not enumerate in recovery mode", owner: production, retry: 3, recover: re_enter_recovery}
usb_unexpected_device:   {label: "Wrong device on the recovery port", owner: production, retry: 1}
usb_link_lost:           {label: "USB link to the module lost", owner: production, retry: 2, recover: re_enter_recovery, from: orin_enumerate}
usb_reset_during_flash:  {label: "USB reset during the flash", owner: production, retry: 2, recover: re_enter_recovery, from: orin_enumerate}
eeprom_unreadable:       {label: "Module EEPROM unreadable", owner: supplier, retry: 1}
eeprom_crc:              {label: "Module EEPROM fails its CRC", owner: supplier, retry: 1}
module_unsupported:      {label: "Module board id, SKU or FAB not in the release", owner: engineering, retry: 1}
partition_mismatch:      {label: "Partition read-back differs", owner: production, retry: 2, recover: re_enter_recovery, from: orin_enumerate}
boot_failed:             {label: "Module did not boot after the flash", owner: engineering, retry: 1}
service_failed:          {label: "A required service failed on first boot", owner: engineering, retry: 1}
l4t_mismatch:            {label: "Module runs another L4T release", owner: engineering, retry: 1}
machine_id_duplicate:    {label: "Machine-id already used by another unit", owner: engineering, retry: 1}
fuse_precondition:       {label: "Fuse burn refused by its guard", owner: quality, retry: 1}
fuse_conflict:           {label: "Module already fused differently", owner: quality, retry: 1}
release_unverified:      {label: "Release signature or artifacts do not verify", owner: engineering, retry: 1}
bundle_mismatch:         {label: "Image bundle differs from the release", owner: engineering, retry: 1}
calibration_shape:       {label: "Calibration record has the wrong shape", owner: quality, retry: 1}
serial_too_long:         {label: "Unit serial does not fit the config record", owner: quality, retry: 1}
registry_unreachable:    {label: "Traceability server unreachable", owner: production, retry: 3, recover: wait}
# signals: not failures (no step raises them), but analysed like failures because they come before failures
slow_link:               {label: "Module links at USB2, not USB3", owner: production, signal: true}
