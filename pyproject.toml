[project]
name = "uav-provisioning-trail"
version = "0.1.0"
description = "Software production support for a UAV line: flashing and compute-module installs with readback, recovery, a per-unit digital paper trail, and the KPIs that tell a one-off from a systemic problem."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "cryptography>=42",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
uavtrail = "uavtrail.cli:main"
uavsim = "uavsim.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uavtrail = ["server/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "qemu: flashes real firmware into emulated microcontrollers (needs qemu-system-arm and arm-none-eabi-gcc)",
  "db: needs PostgreSQL (UAV_TEST_DATABASE_URL)",
]
