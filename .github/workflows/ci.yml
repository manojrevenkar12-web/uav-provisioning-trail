name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uav
          POSTGRES_PASSWORD: uav
          POSTGRES_DB: uav
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U uav" --health-interval 5s --health-retries 10
    env:
      UAV_DATABASE_URL: postgresql+psycopg://uav:uav@localhost:5432/uav
      UAV_TEST_DATABASE_URL: postgresql+psycopg://uav:uav@localhost:5432/uav_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: QEMU and the ARM toolchain
        # without man-db's trigger and recommended packages the install takes a minute instead of many
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends qemu-system-arm gcc-arm-none-eabi
      - run: pip install -e ".[dev]"
      - name: Test database
        run: PGPASSWORD=uav psql -h localhost -U uav -d uav -c "create database uav_test"
      - name: Lint and types
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src
      - name: Firmware builds without warnings
        run: make -C firmware TARGET=fc VERSION=0.0.1 KNOWN_REVS=BC && make -C firmware TARGET=pmu VERSION=0.0.1 KNOWN_REVS=AB
      - name: Tests (real firmware in QEMU, PostgreSQL)
        run: pytest -q
      - name: The dev shift, against its truth
        run: |
          uavsim run campaigns/dev/shift-a.yaml
          uavtrail evaluate data/runs/shift-a > evaluation.json
          python - <<'PY'
          import json
          e = json.load(open("evaluation.json"))
          i, t, irr = e["issues"], e["trail"], e["irreversible"]
          print(json.dumps({"found": i["found"], "expected": i["expected"], "false_alarms": len(i["false_alarms"]),
                            "chains_broken": len(t["chains_broken"]), "unguarded": len(irr["unguarded"])}))
          assert i["found"] == i["expected"] and not i["false_alarms"], i
          assert not t["chains_broken"] and not t["certificates_bad"], t
          assert not irr["unguarded"] and not irr["burnt_without_trail"], irr
          PY
      - name: Held-out first runs are never rewritten
        run: |
          for set in heldout/*/; do
            name=$(basename "$set")
            if [ -f "reports/heldout/$name/first_run.json" ]; then
              uavsim heldout "$name"
              git diff --exit-code "reports/heldout/$name/first_run.json"
            fi
          done

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [line, console]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uav
          POSTGRES_PASSWORD: uav
          POSTGRES_DB: uav
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U uav" --health-interval 5s --health-retries 10
    env:
      UAV_DATABASE_URL: postgresql+psycopg://uav:uav@localhost:5432/uav
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: QEMU and the ARM toolchain
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends qemu-system-arm gcc-arm-none-eabi
      - run: pip install -e .
      - name: A shift on the emulated line
        run: uavsim run campaigns/dev/shift-a.yaml
      - working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the server and console
        run: |
          nohup uavtrail serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - working-directory: web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            serve.log

  image:
    runs-on: ubuntu-latest
    needs: [line, console]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run a shift with compose
        run: |
          docker compose build
          docker compose up -d server
          for i in $(seq 1 240); do curl -sf localhost:8000/api/health | grep -q '"events":[1-9]' && break; sleep 2; done
          curl -sf localhost:8000/api/overview | grep -q first_pass_yield
          curl -sf localhost:8000/issues | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
